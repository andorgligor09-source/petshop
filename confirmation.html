<!DOCTYPE html>
<html lang="en">
<head>
<script>!function(){var t=localStorage.getItem("pawsome_theme")||(window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawMart — Order Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comforme.css">
</head>
<body>

<header>
  <a href="shop.html" class="logo">🐾 PawMart</a>
</header>

<div class="main">

  <div class="check-circle">
    <svg viewBox="0 0 36 36" fill="none">
      <path d="M9 18l6 6 12-12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Order confirmed!</h1>
  <p class="sub">Thanks for shopping with PawMart. Your order is on its way — your furry friend will love it. 🐾</p>

  <div class="card" id="items-card">
    <div class="card-title">What you ordered</div>
    <div class="items" id="items-list"></div>
  </div>

  <div class="card">
    <div class="card-title">Order summary</div>
    <div class="detail-row"><span class="k">Subtotal</span><span class="v" id="c-sub"></span></div>
    <div class="detail-row"><span class="k">Delivery</span><span class="v" id="c-ship"></span></div>
    <div class="detail-row"><span class="k">Tax (8%)</span><span class="v" id="c-tax"></span></div>
    <div class="detail-row" id="c-disc-row" style="display:none"><span class="k">Promo</span><span class="v" style="color:var(--green)" id="c-disc"></span></div>
    <div class="detail-row total"><span class="k">Total</span><span class="v" id="c-total"></span></div>
  </div>

  <div class="card">
    <div class="card-title">Delivery</div>
    <div class="detail-row"><span class="k">Method</span><span class="v" id="c-shipmethod"></span></div>
    <div class="detail-row"><span class="k">Estimated arrival</span><span class="v" id="c-eta"></span></div>
  </div>

  <a href="shop.html" class="shop-btn">Continue shopping</a>
  <div class="order-num">Order #PW-<span id="c-ordernum"></span> · Confirmation sent to your email</div>

</div>

<script src="comforme.js"></script>
<script src="darkmode.js"></script>
</body>
</html>
